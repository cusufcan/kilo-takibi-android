name: UI testleri

# Emülatör yavaş ve ara sıra kararsız; her push'ta değil, elle başlatılır (ADR-0042).
on:
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Emülatörün donanım hızlandırmasıyla çalışması için KVM erişimi.
      - name: KVM'i aç
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde UI testleri
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Raporları yükle (hata olursa da)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-raporlari
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
